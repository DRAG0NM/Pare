<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Pare — AI disk investigator for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a17" />
      <stop offset="1" stop-color="#0b1210" />
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b88f" />
      <stop offset="1" stop-color="#0a6650" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3cc59b" stop-opacity="0.16" />
      <stop offset="1" stop-color="#3cc59b" stop-opacity="0" />
    </radialGradient>
    <style>
      .t { font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei UI', sans-serif; }
      .cell { fill: #1c2a26; stroke: #2b3a35; stroke-width: 1; }
      .waste { fill: #1d4a3d; stroke: #3cc59b; stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: pare 6s ease-in-out infinite; }
      .w2 { animation-delay: 0.6s; }
      .w3 { animation-delay: 1.2s; }
      .w4 { animation-delay: 1.8s; }
      @keyframes pare {
        0%, 18% { opacity: 1; transform: scale(1); }
        34%, 72% { opacity: 0.08; transform: scale(0.82); }
        90%, 100% { opacity: 1; transform: scale(1); }
      }
      .scan { animation: sweep 6s linear infinite; }
      @keyframes sweep {
        0% { transform: translateX(0); opacity: 0; }
        8% { opacity: 0.9; }
        40% { opacity: 0.9; }
        48%, 100% { transform: translateX(470px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .waste, .scan { animation: none; }
      }
    </style>
    <clipPath id="map"><rect x="740" y="48" width="480" height="224" rx="14" /></clipPath>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)" />
  <rect width="1280" height="320" rx="24" fill="url(#glow)" />
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#24332e" />

  <g transform="translate(72 92)">
    <rect width="72" height="72" rx="18" fill="url(#logo)" />
    <path d="M23.6 54V20.2h13.5a11.25 11.25 0 0 1 0 22.5H23.6" fill="none" stroke="#fff" stroke-width="7.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M41 52.3c6.2 1.7 11.2-0.6 14-6.2" fill="none" stroke="#bdf0dd" stroke-width="3.4" stroke-linecap="round" />
  </g>
  <text x="168" y="148" class="t" font-size="64" font-weight="700" fill="#e9f1ed" letter-spacing="1">Pare</text>
  <text x="72" y="214" class="t" font-size="26" font-weight="500" fill="#cfdcd6">An AI disk investigator for Windows.</text>
  <text x="72" y="252" class="t" font-size="20" fill="#7f9690">找出只属于这台电脑的空间浪费 · 每一步都可核对、可撤回</text>

  <g clip-path="url(#map)">
    <rect x="740" y="48" width="480" height="224" fill="#121b18" />
    <rect class="cell" x="744" y="52" width="200" height="140" rx="6" />
    <rect class="waste" x="948" y="52" width="148" height="92" rx="6" />
    <rect class="cell" x="1100" y="52" width="116" height="92" rx="6" />
    <rect class="cell" x="948" y="148" width="72" height="44" rx="6" />
    <rect class="waste w3" x="1024" y="148" width="72" height="44" rx="6" />
    <rect class="cell" x="1100" y="148" width="116" height="44" rx="6" />
    <rect class="waste w2" x="744" y="196" width="120" height="72" rx="6" />
    <rect class="cell" x="868" y="196" width="152" height="72" rx="6" />
    <rect class="cell" x="1024" y="196" width="96" height="72" rx="6" />
    <rect class="waste w4" x="1124" y="196" width="92" height="72" rx="6" />
    <rect class="scan" x="720" y="48" width="36" height="224" fill="#3cc59b" opacity="0.18" />
  </g>
  <rect x="740.5" y="48.5" width="479" height="223" rx="13.5" fill="none" stroke="#2b3a35" />
</svg>
